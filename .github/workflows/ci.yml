name: Graphic Studio CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphic-studio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Quality gate
        run: npm run check
