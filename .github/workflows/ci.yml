name: Graphic Studio CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphic-studio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Quality gate
        run: npm run check
      - name: Browser regression suite
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/graphic-studio-vite.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/graphic-studio/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/graphic-studio-vite.log
            exit 1
          fi
          npm run smoke:browser
          npm run smoke:v18
          npm run smoke:cpu
